apiVersion: apps/v1
kind: Deployment
metadata:
  name: conftest-book-app
  labels:
    app: conftest-book-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: conftest-book-app
  template:
    metadata:
      labels:
        app: conftest-book-app
    spec:
      containers:
        - name: app
          image: ghcr.io/example/conftest-book-app:v0.1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
