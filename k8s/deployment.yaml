apiVersion: apps/v1
kind: Deployment
metadata:
  name: conftest-book-app
  labels:
    app: conftest-book-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: conftest-book-app
  template:
    metadata:
      labels:
        app: conftest-book-app
    spec:
      serviceAccountName: conftest-book-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: app
          image: 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/conftest-book-dev-app:v0.1.0
          ports:
            - containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
