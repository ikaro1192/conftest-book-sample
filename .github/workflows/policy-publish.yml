name: Publish policy bundle

# 第11章で policy.yml の publish ジョブに置き換えるまで、手動で実行したときだけ動かす
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-conftest

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push policy bundle
        run: |
          conftest push ghcr.io/${{ github.repository }}/policy:${{ github.sha }}
          conftest push ghcr.io/${{ github.repository }}/policy:latest
