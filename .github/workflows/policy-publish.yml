name: Publish policy bundle

on:
  push:
    branches: [main]
    paths:
      - "policy/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-conftest

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push policy bundle
        run: |
          conftest push ghcr.io/${{ github.repository }}/policy:${{ github.sha }}
          conftest push ghcr.io/${{ github.repository }}/policy:latest
