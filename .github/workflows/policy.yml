name: Policy

on:
  pull_request:
    paths:
      - "policy/**"
      - "data/**"
      - ".regal/**"
      - ".github/workflows/policy.yml"
  push:
    branches: [main]
    paths:
      - "policy/**"
      - "data/**"
      - ".regal/**"
      - ".github/workflows/policy.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.21.1

      - uses: open-policy-agent/setup-regal@v2
        with:
          version: 0.43.0

      - name: Check formatting
        run: opa fmt --list --fail policy/

      - name: Check
        run: opa check --strict policy/

      - name: Test
        run: opa test policy/ -v

      - name: Lint
        run: regal lint --format github policy/
