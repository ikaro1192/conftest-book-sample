name: Policy

on:
  pull_request:
    paths:
      - "policy/**"
      - "data/**"
      - ".regal/**"
      - ".github/workflows/policy.yml"
  push:
    branches: [main]
    paths:
      - "policy/**"
      - "data/**"
      - ".regal/**"
      - ".github/workflows/policy.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.21.1

      - uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
        with:
          version: 0.43.0

      - name: Check formatting
        run: opa fmt --list --fail policy/

      - name: Check
        run: opa check --strict policy/

      - name: Test
        run: opa test policy/ -v

      - name: Lint
        run: regal lint --format github policy/
