apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-report
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-report
  template:
    metadata:
      labels:
        app: legacy-report
    spec:
      serviceAccountName: legacy-report
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: report
          image: 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/legacy-report:v2.4.0
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
