apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-aggregate
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: legacy-report
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: aggregate
              image: 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/legacy-report:v2.4.0
              args: ["aggregate"]
              securityContext:
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: "100m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
