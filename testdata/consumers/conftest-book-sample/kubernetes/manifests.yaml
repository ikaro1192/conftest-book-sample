apiVersion: v1
kind: ServiceAccount
metadata:
  name: conftest-book-app
---
apiVersion: v1
kind: Service
metadata:
  name: conftest-book-app
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: conftest-book-app
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: conftest-book-app
  name: conftest-book-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: conftest-book-app
  template:
    metadata:
      labels:
        app: conftest-book-app
    spec:
      containers:
      - image: 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/conftest-book-dev-app:v0.1.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        name: app
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: conftest-book-app
